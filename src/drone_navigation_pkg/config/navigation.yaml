/**:
  ros__parameters:
    use_sim_time: true
    map_frame: map
    base_frame: drone_base_link
    voxel_resolution: 0.10
    obstacle_inflation: 0.25
    obstacle_memory_seconds: 1.0
    local_horizontal_range: 5.5
    local_vertical_range: 4.5
    virtual_ceiling: 2.9
    max_velocity: 0.3
    max_acceleration: 0.6
    takeoff_height: 1.8
    # PX4 external-sim odometry is nominally 5 Hz but showed 0.38 s p99 wall
    # gaps under RTX load. Keep HOLD above that jitter while LAND remains 1.2 s.
    odometry_hold_timeout: 0.60
    data_land_timeout: 1.2
    planner_map_timeout: 0.60
    fixed_setpoint_timeout: 0.60
    # Diagnostic-only direct position intent. Competition bringup keeps this off.
    allow_fixed_setpoint_diagnostic: false
    offboard_prestream_seconds: 1.0
    # A 5 s takeoff spline reaches only 2 cm at t=1 s. Do not let the 5 Hz
    # rolling replanner repeatedly restart it before meaningful progress.
    minimum_replan_execution_seconds: 4.0
    ground_disarm_delay_seconds: 2.0
    px4_map_origin: [4.55, -0.38, 1.13]
    # Isaac world pose envelope required before any ground arm request.
    prearm_spawn_position: [4.55, -0.38, 1.13]
    prearm_position_tolerance: 0.02
    prearm_max_speed: 0.05
    prearm_max_tilt_deg: 3.0
    mission_autostart: false
    drop_search_pose: [0.0, 0.0, 1.8]
    drop_min_height: 1.6
    drop_max_height: 2.0
