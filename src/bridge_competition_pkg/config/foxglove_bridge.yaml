# foxglove_bridge 参数配置
#
# 加载方式：ros2 launch bridge_competition_pkg foxglove_bridge.launch.py
# 由 systemd --user foxglove-bridge.service 守护常驻
#
# ROS_DOMAIN_ID 必须 =45 才能看到 /fmu/* 和 PX4 / Isaac Sim 的 topic
# 不要在这里设置 ROS_DOMAIN_ID，由 systemd unit Environment 统一管理

/foxglove_bridge:
  ros__parameters:
    # 网络
    port: 8765
    address: 0.0.0.0          # 0.0.0.0 = 监听所有接口，跨机访问可用；只本机改成 127.0.0.1

    # 性能
    use_compression: true     # 大流量（图像 / 点云）强烈建议开
    send_buffer_size: 10000000
    num_threads: 4            # 0 = 单线程；多订阅器并发调到 4-8

    # 只开观测 capability，避免 Studio 成为第二个 /fmu/in/* 写入者。
    # 比赛最终态可以按需收紧（去掉 connectionGraph 进一步限制），开发期保留。
    capabilities:
      - connectionGraph

    # 空白名单：完全删除 topic_whitelist 参数 = 不过滤，Studio 看到所有 topic
    # 调试期改完节点立刻能看到；比赛录制时建议加回，按需收紧：
    #   topic_whitelist:
    #     - "^/drone/navigation/.+"
    #     - "^/fmu/in/.+"
    #     - "^/fmu/out/.+"
    #     - "^/drone0/.+"
    #     - ...

    # 高频 / 大 topic 黑洞名单（按需加；空白名单下靠这个兜底）
    topic_blacklist:
      - "^/arm_camera/(rgb|depth)_(left|right)$"   # 双目 raw 太大

    # QoS 覆盖：PX4 /fmu/* 是 BEST_EFFORT+TRANSIENT_LOCAL，bridge 默认 RELIABLE 订阅不上
    # 完整 key = "<topic_regex>::<policy>"，value 是字符串表示
    qos_overrides:
      "/fmu/out/vehicle_odometry::reliability": "best_effort"
      "/fmu/out/vehicle_status_v1::reliability": "best_effort"
      "/fmu/out/vehicle_attitude::reliability": "best_effort"
      "/fmu/out/vehicle_local_position::reliability": "best_effort"
      "/fmu/out/sensor_combined::reliability": "best_effort"
      "/fmu/out/timesync_status::reliability": "best_effort"